#     expires = "inherit|+7 days"  # inherit|(+/-)# (seconds|minutes|hours|days|months|years)
#     public = "inherit|public"    # set Cache-Control: public unless it gets private
#     lastModified = "+0 seconds"  # set Last-Modified to current time
