# Honey Config v1.0
# Title: Wordpress
#
# Run with: honey -config config/wordpress.toml

listen = ":8080"

# The proxies in front of Honey (e.g. Caddy or nginx handling HTTPS) whose
# X-Forwarded-For and X-Forwarded-Proto are believed.  The default trusts
# loopback and private addresses; list only your proxy's if anything else
# could reach Honey from them.  Anyone else is taken to be a visitor.
# trustedProxies = ["127.0.0.1"]

# The site's host names.  Requests for any other host get a 421, rather
# than reaching WordPress and filling the cache.  "*.example.com" allows
# any subdomain.  Leave it out to allow any host.
# hosts = ["www.example.com", "example.com"]

# The web server running WordPress, e.g. Apache or nginx on another port.
# It is sent the Host clients asked for; set host to send another one.
[backend]
uri = "http://127.0.0.1:8081"
# host = "www.example.com"
timeout = "30s"             # how long to wait for WordPress to start responding
stallTimeout = "30s"        # how long WordPress may go silent partway through a response

[cache]
maxSize = "256MB"           # memory for cached responses; least recently used are evicted
maxObjectSize = "10MB"      # larger responses are streamed to the client, not cached
defaultTTL = "5m"           # freshness for responses without max-age, s-maxage or Expires
staleIfError = "1h"         # if WordPress errors or times out, serve expired pages this long
staleWhileRevalidate = "1d" # serve expired pages straight away while they're refreshed, so nobody waits
# persist = "/var/lib/honey/cache.snapshot"  # keep the cache across restarts
staticFiles = true          # cache images, css, js, fonts, media and documents
brotli = true               # brotli compress html, css, js, json, svg... for clients that accept it
gzip = true                 # gzip them for clients that accept gzip but not brotli
compressMinSize = "1KB"     # smaller responses aren't compressed
# Requests with these cookies (name prefixes) aren't cached: logged in users,
# password-protected posts, commenters and WooCommerce shoppers.  This is
# the default; add any cookies your plugins use for logged in visitors, or
# to remember anything about a visitor (a cart, say).
bypassCookies = ["wordpress_logged_in_", "wp-postpass_", "comment_author_", "woocommerce_items_in_cart", "wp_woocommerce_session_"]
# Commenters get cached pages anyway, with their comments section fetched
# for them, if the pages use Edge Side Includes for it - as the WordPress
# plugin's do, with block themes
esiCookies = ["comment_author_"]
# Other cookies are removed from requests which may be cached, so that one
# visitor's cookies can't change the page cached for everyone - except
# these, which are passed to WordPress, and which pages are cached
# separately for each value of, e.g. ["site_lang_id"].  Responses may set
# them too.
allowedCookies = []
# Responses which set any other cookie aren't cached (the page may go with
# it), but go to that visitor with it.  Cookies (name prefixes) which
# don't matter to the page, e.g. Polylang's ["pll_language"], can be
# stripped from responses instead, so that they are cached.  Honey logs the
# cookies which stop responses being cached.
stripCookies = []
# The Cache-Control header browsers get, instead of the one Honey caches by.
# "no-cache" makes them check back each time (Honey answers with a quick
# 304 if the page hasn't changed), so purges reach them straight away.
# browserCacheControl = "no-cache"
# The only query parameters which matter - others are removed, so that they
# can't be used to get around the cache.  These are WordPress core's (ver is
# on css and js); add any your plugins use before uncommenting this.
# queryParams = ["p", "page_id", "s", "paged", "cat", "tag", "author", "m", "year", "monthnum", "day", "post_type", "cpage", "replytocom", "attachment_id", "ver"]

# Don't cache previews, the RSS feed, or the admin and login pages.
# regex = true matches against the path and query string; otherwise
# match is a path prefix.
[[route]]
match = "(?:[?&]preview=true(?:&|$)|/(?:feed|wp-admin|wp-login))"
regex = true
cache = false

# Uploaded media rarely changes, so cache it for a week (unless WordPress,
# or the web server in front of it, says otherwise), and serve it from the
# cache to logged in users too.  Routes can override defaultTTL,
# staleIfError, queryParams and bypassCookies; the first matching route's
# settings apply, but cache = false applies wherever it is in the list.
[[route]]
match = "/wp-content/uploads/"
defaultTTL = "7d"
bypassCookies = []
browserCacheControl = "public, max-age=604800"

# css and js with a version (?ver=...) could be kept by browsers for a year.
# Only do this if your theme and plugins change the version whenever they
# change the file: browsers won't ask for it again, even after a purge.
# [[route]]
# match = "\\.(css|js)\\?(.*&)?ver="
# regex = true
# browserCacheControl = "public, max-age=31536000, immutable"

# Fill the cache from the sitemap when Honey starts, and after everything is
# purged, so that visitors find pages cached
# [warm]
# sitemap = "https://www.example.com/wp-sitemap.xml"
# rate = 2                  # pages a second

# Log each request to stdout
[log]
access = true
format = "text"             # text|json

# The admin page (stats and purging) at http://127.0.0.1:9090/, and
# Prometheus metrics at /metrics.  It has no login: keep it private, and
# reach it with an SSH tunnel.
# [admin]
# listen = "127.0.0.1:9090"

# Who may purge the cache (curl -X PURGE ...) and refresh it with
# Cache-Control: no-cache.  Nobody is trusted unless listed here.  If Honey
# is behind another proxy on this host, don't allow 127.0.0.1 - every
# request would come from it - use the secret instead.
[control]
allowIPs = []
# secret = "a long random string"    # sent in the X-Honey-Secret header

# ----------------------------------------------------------------------
