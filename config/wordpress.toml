# Honey Config v1.0
# Title: Wordpress
#
# Run with: honey -config config/wordpress.toml

listen = ":8080"

[backend]
uri = "https://www.insomniac.com"
timeout = "30s"             # how long to wait for WordPress to start responding
stallTimeout = "30s"        # how long WordPress may go silent partway through a response

[cache]
maxSize = "256MB"           # memory for cached responses; least recently used are evicted
maxObjectSize = "10MB"      # larger responses are streamed to the client, not cached
defaultTTL = "5m"           # freshness for responses without max-age, s-maxage or Expires
staleIfError = "1h"         # if WordPress errors or times out, serve expired pages this long
staticFiles = true          # cache images, css, js, fonts, media and documents
brotli = true               # brotli compress html, css, js, json, svg... for clients that accept it
gzip = true                 # gzip them for clients that accept gzip but not brotli
compressMinSize = "1KB"     # smaller responses aren't compressed
allowedCookies = []         # cookies allowed through the cache, e.g. ["site_lang_id"]
# The only query parameters which matter - others are removed, so that they
# can't be used to get around the cache.  These are WordPress core's (ver is
# on css and js); add any your plugins use before uncommenting this.
# queryParams = ["p", "page_id", "s", "paged", "cat", "tag", "author", "m", "year", "monthnum", "day", "post_type", "cpage", "replytocom", "attachment_id", "ver"]

# Don't cache previews, the RSS feed, or the admin and login pages.
# regex = true matches against the path and query string; otherwise
# match is a path prefix.
[[route]]
match = "(?:[?&]preview=true(?:&|$)|/(?:feed|wp-admin|wp-login))"
regex = true
cache = false

# Uploaded media rarely changes, so cache it for a week (unless WordPress,
# or the web server in front of it, says otherwise).  Routes can override
# defaultTTL, staleIfError and queryParams; the first matching route's
# settings apply, but cache = false applies wherever it is in the list.
[[route]]
match = "/wp-content/uploads/"
defaultTTL = "7d"

# Log each request to stdout
[log]
access = true
format = "text"             # text|json

# Prometheus metrics at http://127.0.0.1:9090/metrics - keep this private
# [metrics]
# listen = "127.0.0.1:9090"

# Who may purge the cache (curl -X PURGE ...) and refresh it with
# Cache-Control: no-cache.  Nobody is trusted unless listed here.  If Honey
# is behind another proxy on this host, don't allow 127.0.0.1 - every
# request would come from it - use the secret instead.
[control]
allowIPs = []
# secret = "a long random string"    # sent in the X-Honey-Secret header

