name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Go that go.mod allows, and the latest release
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags e2e ./e2e

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build without cgo
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/honey

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --build-arg VERSION=ci -t honey:ci .

      - name: Check it runs
        run: |
          docker run --rm honey:ci -version
          printf '[backend]\nuri = "http://127.0.0.1:1"\n' > honey.toml
          docker run -d --name honey -p 8080:8080 -v "$PWD/honey.toml:/etc/honey/honey.toml:ro" honey:ci
          for i in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.5; done
          # The backend is unreachable, so Honey should answer with a 502
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 502
          docker stop honey

  wordpress:
    name: WordPress end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # A real WordPress (with contrib/wordpress/honey-purge.php) behind
      # Honey, with a database: see e2e/run.sh
      - name: Test
        run: ./e2e/run.sh
        env:
          HONEY_E2E_WOOCOMMERCE: "1"

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e/logs.txt
