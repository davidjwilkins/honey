# Honey in front of the end-to-end tests' WordPress: like
# config/wordpress.toml, with a local backend and purging allowed.
listen = ":8080"
hosts = ["localhost"]

[backend]
uri = "http://wordpress"

[cache]
defaultTTL = "5m"
staleIfError = "1h"
staleWhileRevalidate = "1d"
# Commenters get cached pages, with their comments section fetched for them
esiCookies = ["comment_author_"]

[[route]]
match = "(?:[?&]preview=true(?:&|$)|/(?:feed|wp-admin|wp-login))"
regex = true
cache = false

[[route]]
match = "/wp-content/uploads/"
defaultTTL = "7d"
bypassCookies = []

[warm]
sitemap = "http://localhost:8080/wp-sitemap.xml"
rate = 50

[log]
access = true

[admin]
listen = ":9090"

[control]
secret = "e2e-secret-0123456789"
