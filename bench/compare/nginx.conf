# nginx's FastCGI cache in front of WordPress on PHP-FPM, configured the
# usual way: pages cached for 10 minutes, except for logged in users,
# commenters and shoppers, POSTs and query strings.  (Stock nginx can't
# purge, so edits show when pages expire.)
fastcgi_cache_path /var/cache/nginx/wordpress levels=1:2 keys_zone=wordpress:64m max_size=512m inactive=60m use_temp_path=off;
fastcgi_cache_key "$scheme$request_method$host$request_uri";

server {
    listen 80 default_server;
    root /var/www/html;
    index index.php;

    set $skip_cache 0;
    if ($request_method = POST) { set $skip_cache 1; }
    if ($query_string != "") { set $skip_cache 1; }
    if ($request_uri ~* "/wp-admin/|/xmlrpc.php|wp-.*\.php|/feed/|sitemap(_index)?\.xml") { set $skip_cache 1; }
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in|woocommerce_items_in_cart|wp_woocommerce_session") { set $skip_cache 1; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass fpm:9000;
        fastcgi_cache wordpress;
        fastcgi_cache_valid 200 301 302 10m;
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        fastcgi_cache_lock on;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        add_header X-Cache $upstream_cache_status;
    }

    location ~* \.(css|js|png|jpe?g|gif|svg|webp|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
